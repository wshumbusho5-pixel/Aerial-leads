# Columbus, Ohio Market Configuration
# Franklin County tax delinquent properties

market:
  id: columbus_oh
  name: Columbus
  state: OH
  county: Franklin
  timezone: America/New_York

# Columbus area ZIP codes
geography:
  zip_codes:
    - "43201"
    - "43202"
    - "43203"
    - "43204"
    - "43205"
