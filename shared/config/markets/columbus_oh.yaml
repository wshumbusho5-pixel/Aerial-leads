# Tax data configuration - ACTUAL column names from Franklin County Excel files
tax_data:
  type: excel
  source: franklin_county_auditor
  files:
    tax_detail: TaxDetail.xlsx
    parcel: Parcel.xlsx
    value: Value.xlsx
    dwelling: Dwelling.xlsx
  field_mappings:
    # TaxDetail.xlsx columns
    parcel_id: "Parcel Id"
    amount_owed: "TotTotal"
    # Parcel.xlsx columns
    parcel_id_parcel: "PARCEL ID"
    address: "SiteAddress"
    owner_name: "OwnerName1"
    mailing_address: "TaxpayerAddress1"
    zip_code: "ZipCode"
    property_type: "LUCDesc"
    # Value.xlsx columns
    parcel_id_value: "Parcel Id"
    market_land: "MarketLand"
    market_impr: "MarketImpr"
    taxable_land: "TaxableLand"
    taxable_impr: "TaxableImpr"
    # Dwelling.xlsx columns
    building_parcel_id: "PARCEL ID"
    year_built: "YRBLT"
    bedrooms: "RMBED"
    bathrooms: "FIXBATH"
    half_baths: "FIXHALF"
    square_feet: "SFLA"

# Code violations API
violations:
  type: arcgis_api
  source: columbus_311
  url: "https://services2.arcgis.com/sddVaUArlQRXYRG3/arcgis/rest/services"
  query_field: address
  max_records_per_request: 1000
  field_mappings:
    case_number: CASE_NBR
    violation_type: VIOLATION_TYPE
    status: STATUS
    opened_date: OPENED_DATE

# Scoring adjustments for this market
scoring:
  tax_debt_ratio:
    high: 0.20
    medium: 0.10
    low: 0.05
  estimated_annual_tax_rate: 0.04

# Data quality filters
data_quality:
  min_amount_owed: 1000.0
  min_years_delinquent: 2
  max_data_age_days: 30
