# Cincinnati, Ohio Market Configuration
# Aerial Leads - Market-specific settings for Hamilton County

market:
  id: "cincinnati_oh"
  name: "Cincinnati, Ohio"
  state: "OH"
  county: "Hamilton"
  timezone: "America/New_York"

# Tax delinquency data source
tax_data:
  type: "web_scraper"
  source: "hamilton_county_auditor"

  urls:
    web_search: "https://www.hamiltoncountyauditor.org/search"
    treasurer: "https://www.hamiltoncountytreasurer.org/"
    gis_portal: "https://cagisonline.hamilton-co.org/"

  field_mappings:
    parcel_id: "PARCEL_NUMBER"
    taxes_owed: "AMOUNT_DUE"
    address: "PROPERTY_ADDRESS"
    owner_name: "OWNER"
    owner_address: "OWNER_ADDRESS"
    mailing_address: "MAILING_ADDRESS"
    zip_code: "ZIP_CODE"
    property_type: "USE_CODE"
    assessed_value: "TOTAL_VALUE"
    market_value: "APPRAISED_VALUE"

# Code violations data source
violations:
  type: "arcgis_api"
  source: "cincinnati_open_data"

  url: "https://gisdata.hamilton-co.org/arcgis/rest/services/OpenData/MapServer/0"

  query_field: "PARCEL_ID"
  max_records_per_request: 1000

  field_mappings:
    case_id: "CASE_ID"
    parcel_number: "PARCEL_ID"
    address: "ADDRESS"
    violation_type: "TYPE"
    status: "STATUS"
    file_date: "DATE_FILED"

