# Columbus, Ohio Market Configuration
# Aerial Leads - Market-specific settings for Franklin County

market:
  id: "columbus_oh"
  name: "Columbus, Ohio"
  state: "OH"
  county: "Franklin"
  timezone: "America/New_York"

# Tax delinquency data source
tax_data:
  type: "excel"  # Options: excel, web_scraper, api
  source: "franklin_county_auditor"

  urls:
    bulk_download: "https://apps.franklincountyauditor.com/Outside_User_Files/"
    web_search: "https://treapropsearch.franklincountyohio.gov/"
    auditor_search: "https://property.franklincountyauditor.com/_web/search/commonsearch.aspx"

  # Excel file configuration (for type: excel)
  files:
    tax_detail: "TaxDetail.xlsx"
    parcel: "Parcel.xlsx"
    value: "Value.xlsx"
    building: "Dwelling.xlsx"  # Contains year_built, bedrooms, bathrooms, sqft (from Appraisal folder)

  # Column mappings from source data to internal schema
  field_mappings:
    # TaxDetail.xlsx columns
    parcel_id: "Parcel Id"
    taxes_owed: "TotTotal"

    # Parcel.xlsx columns
    parcel_parcel_id: "PARCEL ID"
    address: "SiteAddress"
    owner_name: "OwnerName1"
    owner_address: "OwnerAddress1"
    mailing_address: "TaxpayerAddress1"
    zip_code: "ZipCode"
    tax_year: "TaxYear"
    neighborhood: "Neighborhood"
    property_type: "LUCDesc"

    # Value.xlsx columns
    market_land: "MarketLand"
    market_improvements: "MarketImpr"
    taxable_land: "TaxableLand"
    taxable_improvements: "TaxableImpr"

    # Dwelling.xlsx columns (building characteristics from Appraisal folder)
    building_parcel_id: "PARCEL ID"
    year_built: "YRBLT"
    bedrooms: "RMBED"
    bathrooms: "FIXBATH"
    half_baths: "FIXHALF"
    square_feet: "SFLA"
    stories: "STORIES"
    condition: "COND"
    style: "STYLE"

# Code violations data source
violations:
  type: "arcgis_api"  # Options: arcgis_api, web_scraper, none
  source: "columbus_open_data"

  url: "https://maps2.columbus.gov/arcgis/rest/services/Schemas/BuildingZoning/MapServer/23"

  # Field to use for parcel lookup
  query_field: "B1_PARCEL_NBR"

  # Maximum records per API request
  max_records_per_request: 2000

  # Column mappings
  field_mappings:
    case_id: "B1_ALT_ID"
    parcel_number: "B1_PARCEL_NBR"
    address: "SITE_ADDRESS"
    violation_group: "B1_PER_GROUP"
    violation_type: "B1_PER_TYPE"
    violation_subtype: "B1_PER_SUB_TYPE"
    violation_category: "B1_PER_CATEGORY"
    status: "B1_APPL_STATUS"
    file_date: "B1_FILE_DD"
    first_inspection_date: "INSP_1ST_DATE"
    first_inspection_result: "INSP_1ST_RESULT"
    last_inspection_date: "INSP_LAST_DATE"
    last_inspection_result: "INSP_LAST_RESULT"
    case_url: "ACA_URL"

# Geographic boundaries
geography:
  # Columbus zip codes
  zip_codes:
    - "43201"
    - "43202"
    - "43203"
    - "43204"
    - "43205"
    - "43206"
    - "43207"
    - "43209"
    - "43210"
    - "43211"
    - "43212"
    - "43213"
    - "43214"
    - "43215"
    - "43219"
    - "43220"
    - "43221"
    - "43222"
    - "43223"
    - "43224"
    - "43227"
    - "43229"
    - "43230"
    - "43231"
    - "43232"
    - "43235"
    - "43240"

# Market-specific scoring adjustments (optional)
# These override the global defaults in settings.py
scoring:
  # Tax debt ratio thresholds (as decimal)
  tax_debt_ratio:
    high: 0.20      # 20%+ = high motivation
    medium: 0.10    # 10-20% = medium motivation
    low: 0.05       # 5-10% = low motivation

  # Estimated annual tax rate (for calculating years delinquent)
  estimated_annual_tax_rate: 0.04  # 4% of assessed value

# Data quality settings
data_quality:
  # Minimum values to consider a property
  min_amount_owed: 1000.0
  min_years_delinquent: 2

  # Maximum age of data to use (days)
  max_data_age_days: 30
