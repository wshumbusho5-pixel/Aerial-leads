# Market-specific scoring adjustments (optional)
# These override the global defaults in settings.py
scoring:
  # Tax debt ratio thresholds (as decimal)
  tax_debt_ratio:
    high: 0.20      # 20%+ = high motivation
    medium: 0.10    # 10-20% = medium motivation
    low: 0.05       # 5-10% = low motivation

  # Estimated annual tax rate (for calculating years delinquent)
  estimated_annual_tax_rate: 0.04  # 4% of assessed value

# Data quality settings
data_quality:
  # Minimum values to consider a property
  min_amount_owed: 1000.0
  min_years_delinquent: 2

  # Maximum age of data to use (days)
  max_data_age_days: 30
