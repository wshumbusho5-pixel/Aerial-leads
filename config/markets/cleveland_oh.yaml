    high: 0.15      # Cleveland has lower property values, adjust thresholds
    medium: 0.08
    low: 0.04

  estimated_annual_tax_rate: 0.035  # 3.5% - slightly lower than Columbus

data_quality:
  min_amount_owed: 800.0   # Lower threshold for Cleveland market
  min_years_delinquent: 2
  max_data_age_days: 30
