# Cleveland, Ohio Market Configuration
# Aerial Leads - Market-specific settings for Cuyahoga County

market:
  id: "cleveland_oh"
  name: "Cleveland, Ohio"
  state: "OH"
  county: "Cuyahoga"
  timezone: "America/New_York"

# Tax delinquency data source
tax_data:
  type: "web_scraper"  # Cleveland uses web scraper (no bulk Excel available)
  source: "cuyahoga_county_treasurer"

  urls:
    web_search: "https://treasurer.cuyahogacounty.us/en-US/Tax-Search.aspx"
    auditor_search: "https://myplace.cuyahogacounty.us/app/search/"
    gis_portal: "https://gis.cuyahogacounty.us/"

  # Column mappings (different from Franklin County!)
  field_mappings:
    parcel_id: "PARCEL_ID"
    taxes_owed: "TOTAL_DUE"
    address: "SITE_ADDR"
    owner_name: "OWNER_NAME"
    owner_address: "OWNER_ADDR"
    mailing_address: "MAIL_ADDR"
    zip_code: "ZIP"
    property_type: "PROPERTY_CLASS"
    assessed_value: "TOTAL_APPRAISED"
    market_value: "MARKET_VALUE"

# Code violations data source
violations:
  type: "arcgis_api"
  source: "cleveland_open_data"

  # Cleveland uses different ArcGIS endpoint
  url: "https://gis.clevelandohio.gov/arcgis/rest/services/OpenData/MapServer/0"

  query_field: "parcel_no"
  max_records_per_request: 1000

  field_mappings:
    case_id: "case_number"
    parcel_number: "parcel_no"
    address: "address"
    violation_type: "violation_type"
    status: "status"
    file_date: "created_date"

